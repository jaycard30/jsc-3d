<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Johnson Space Center</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="css2d-container"></div>

  <div id="hud">
    <div id="hud-location">Johnson Space Center</div>
    <button id="hud-back" class="hidden">&#8592; Back to Campus</button>
  </div>

  <div id="loading">
    <div id="loading-inner">
      <div id="loading-logo">&#9654;</div>
      <div id="loading-text">Johnson Space Center</div>
      <div id="loading-sub">Loading…</div>
    </div>
  </div>

  <script src="/node_modules/gsap/dist/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>

</html>
